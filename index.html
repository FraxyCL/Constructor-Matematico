<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Constructor Matemático</title><link rel="stylesheet" href="css/styles.css"></head><body>
<header id="top"><div class="brand"><div class="logo">∑ Constructor Matemático</div><div class="sub">Profesor Michael Núñez²</div></div>
<button data-act="new">＋ Nuevo</button><button data-act="undo" title="Ctrl+Z">↶ Deshacer</button><button data-act="redo" title="Ctrl+Y">↷ Rehacer</button><button data-act="clear">🗑 Limpiar</button>
<span class="sp"></span><button data-act="dark" title="Modo oscuro de la interfaz">🌙</button><button data-act="xv">👁 Vista de exportación</button><span class="sep"></span>
<button class="pri" data-act="copy">📋 Copiar imagen</button><button data-act="png">⬇ PNG</button><button data-act="svg">⬇ SVG</button></header>
<div id="app"><nav id="side"></nav><aside id="panel"></aside>

<script src="js/registry.js"></script><script src="js/common.js"></script><script src="js/state.js"></script><script src="js/history.js"></script>

<script>App.init();
(()=>{const el=document.getElementById('visits');let n=null;try{n=(parseInt(localStorage.getItem('cm-visits'),10)||0)+1;localStorage.setItem('cm-visits',String(n))}catch(e){}
if(n!==null&&el){el.textContent='👁 '+n.toLocaleString('es-CL');el.hidden=false}})();</script></body></html>
